name: Generate pastel contribution snake

on:
  schedule:
    - cron: "17 0 * * *"   # every day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-pastel.svg?color_snake=#ff8fb1&color_dots=#ebedf0,#b5e5cf,#9cc5f2,#b79ae8,#ff8fb1
            dist/snake-pastel-dark.svg?palette=github-dark&color_snake=#ff9ebb&color_dots=#161b22,#d4f1e4,#9cc5f2,#c3a8ec,#ff9ebb

      - name: Publish the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
