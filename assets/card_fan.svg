<svg xmlns="http://www.w3.org/2000/svg" width="490" height="190" viewBox="0 0 490 190">
  <defs><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8a8fa8" flood-opacity="0.18"/></filter></defs>
  <rect x="5" y="4" width="480" height="180" rx="14" fill="#ffffff" stroke="#e6e9f0" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="18" y="17" width="126" height="154" rx="10" fill="#f7f8fc" stroke="#edf0f6"/>
  
  <g transform="translate(66,88)">
    <circle r="40" fill="none" stroke="#dfe4ee" stroke-width="2"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="-19" rx="9" ry="18" fill="#9cc5f2"/>
      <ellipse cx="0" cy="-19" rx="9" ry="18" fill="#c3a8ec" transform="rotate(120)"/>
      <ellipse cx="0" cy="-19" rx="9" ry="18" fill="#8ccfb6" transform="rotate(240)"/>
    </g>
    <circle r="7" fill="#ffffff" stroke="#c9cfdb" stroke-width="2"/>
  </g>
  <g transform="translate(118,40)">
    <rect x="-5" y="0" width="10" height="92" rx="5" fill="#ffffff" stroke="#c9cfdb"/>
    <circle cx="0" cy="100" r="11" fill="#ff9ebb"/>
    <rect x="-2.5" width="5" rx="2" fill="#ff9ebb" y="60" height="40">
      <animate attributeName="y" values="70;14;14;70" keyTimes="0;0.45;0.75;1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="height" values="30;86;86;30" keyTimes="0;0.45;0.75;1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="66" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#8a8fa8">PWM 33–100%</text>
  <text x="160" y="52" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#4a6fa5">Smart Fan Control</text>
  <text x="160" y="88" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5b6178">Fixed &amp; completed an open-source</text><text x="160" y="110" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5b6178">Arduino fan controller: LM35, PWM,</text><text x="160" y="132" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5b6178">75/70 °C hysteresis, unit tests.</text>
  <rect x="160" y="148" width="92" height="24" rx="12" fill="#d4f1e4"/><text x="206" y="164" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2f7d62">Arduino C++</text><rect x="260" y="148" width="92" height="24" rx="12" fill="#ffe6d5"/><text x="306" y="164" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b5603a">PlatformIO</text><rect x="360" y="148" width="67" height="24" rx="12" fill="#ece4f7"/><text x="394" y="164" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#6b4fa1">Proteus</text>
  
</svg>
